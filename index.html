<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#1a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pranksville" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Windows / Microsoft Store -->
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-TileColor" content="#1a0a0a" />
    <meta name="msapplication-navbutton-color" content="#1a0a0a" />

    <!-- Samsung / Galaxy Store -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO / Store Descriptions -->
    <title>Pranksville — Manor of Cursed Pranks</title>
    <meta name="description" content="A terrifying horror game. Explore 50 cursed rooms across 5 levels of a haunted mansion. Survive pranks, collect keys, and escape with your sanity — if you can." />
    <meta name="keywords" content="horror game, haunted mansion, survival horror, prank game, scary game, puzzle horror" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Pranksville — Manor of Cursed Pranks" />
    <meta property="og:description" content="50 rooms. 5 levels. Countless terrors. Can you escape the mansion with your sanity intact?" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />

    <!-- Safe area padding for notched devices -->
    <style>
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body class="bg-black overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fake HTML5 ad SDK (placeholder) -->
    <script>
      // Simulated HTML5 interstitial ad network placeholder.
      // Exposes window.afficherPubliciteInterstitielle() which pauses the game,
      // shows a black screen with a 5-second countdown, then resumes play.
      (function () {
        var AD_DURATION = 5; // seconds
        var overlay = null;
        var countdownEl = null;
        var timer = null;

        function createOverlay() {
          overlay = document.createElement('div');
          overlay.id = 'interstitial-ad-overlay';
          overlay.style.cssText = [
            'position:fixed',
            'inset:0',
            'z-index:99999',
            'background:#000000',
            'display:flex',
            'flex-direction:column',
            'align-items:center',
            'justify-content:center',
            'font-family:Georgia,serif',
            'color:#888888',
            'text-align:center',
            'user-select:none',
            'cursor:default',
          ].join(';');

          var label = document.createElement('div');
          label.textContent = 'Publicité';
          label.style.cssText = [
            'font-size:11px',
            'letter-spacing:0.5em',
            'text-transform:uppercase',
            'margin-bottom:32px',
            'opacity:0.5',
          ].join(';');
          overlay.appendChild(label);

          var adBox = document.createElement('div');
          adBox.style.cssText = [
            'width:300px',
            'max-width:80vw',
            'height:250px',
            'border:1px solid #333333',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'margin-bottom:32px',
            'background:#0a0a0a',
          ].join(';');
          var adContent = document.createElement('div');
          adContent.textContent = 'Emplacement publicitaire\nHTML5 — Placeholder';
          adContent.style.cssText = [
            'font-size:13px',
            'white-space:pre-line',
            'line-height:1.6',
            'opacity:0.6',
          ].join(';');
          adBox.appendChild(adContent);
          overlay.appendChild(adBox);

          countdownEl = document.createElement('div');
          countdownEl.style.cssText = [
            'font-size:14px',
            'opacity:0.7',
          ].join(';');
          overlay.appendChild(countdownEl);

          document.body.appendChild(overlay);
        }

        function removeOverlay() {
          if (overlay && overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
          overlay = null;
          countdownEl = null;
        }

        window.afficherPubliciteInterstitielle = function () {
          return new Promise(function (resolve) {
            // Pause the game via a custom event the React app listens for.
            document.dispatchEvent(new CustomEvent('pranksville:ad-start'));

            createOverlay();

            var remaining = AD_DURATION;
            countdownEl.textContent = 'Reprise dans ' + remaining + '...';

            timer = setInterval(function () {
              remaining -= 1;
              if (remaining <= 0) {
                clearInterval(timer);
                timer = null;
                removeOverlay();
                // Resume the game.
                document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                resolve();
              } else {
                countdownEl.textContent = 'Reprise dans ' + remaining + '...';
              }
            }, 1000);
          });
        };
      })();
    </script>
  </body>
</html>
