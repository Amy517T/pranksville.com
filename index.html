<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#1a0a0a" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS / Apple -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pranksville" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <!-- Windows / Microsoft Store -->
    <meta name="msapplication-TileImage" content="/icons/icon-144.png" />
    <meta name="msapplication-TileColor" content="#1a0a0a" />
    <meta name="msapplication-navbutton-color" content="#1a0a0a" />

    <!-- Samsung / Galaxy Store -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- SEO / Store Descriptions -->
    <title>Pranksville — Manor of Cursed Pranks</title>
    <meta name="description" content="A terrifying horror game. Explore 50 cursed rooms across 5 levels of a haunted mansion. Survive pranks, collect keys, and escape with your sanity — if you can." />
    <meta name="keywords" content="horror game, haunted mansion, survival horror, prank game, scary game, puzzle horror" />

    <!-- Open Graph / Social -->
    <meta property="og:title" content="Pranksville — Manor of Cursed Pranks" />
    <meta property="og:description" content="50 rooms. 5 levels. Countless terrors. Can you escape the mansion with your sanity intact?" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />

    <!-- Safe area padding for notched devices -->
    <style>
      body {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
    </style>
  </head>
  <body class="bg-black overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google AdMob Interstitial Ads -->
    <script>
      (function () {
        var ADMOB_ANDROID_APP_ID = 'ca-app-pub-4970227942304243~8973417513';
        var ADMOB_ANDROID_AD_UNIT = 'ca-app-pub-4970227942304243/7660335848';
        var ADMOB_IOS_APP_ID = 'ca-app-pub-4970227942304243~6723543172';
        var ADMOB_IOS_AD_UNIT = 'ca-app-pub-4970227942304243/8691230961';

        function isAndroid() { return /android/i.test(navigator.userAgent); }
        function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent); }
        function isMobile() { return isAndroid() || isIOS(); }

        // --- Cordova / AdMob plugin path (native app) ---
        if (isMobile() && window.cordova && window.admob) {
          var appId = isAndroid() ? ADMOB_ANDROID_APP_ID : ADMOB_IOS_APP_ID;
          var adUnitId = isAndroid() ? ADMOB_ANDROID_AD_UNIT : ADMOB_IOS_AD_UNIT;

          document.addEventListener('deviceready', function () {
            window.admob.setAppID({ appID: appId });
            window.admob.interstitial().load({ id: adUnitId });
          }, false);

          window.afficherPubliciteInterstitielle = function () {
            return new Promise(function (resolve) {
              document.dispatchEvent(new CustomEvent('pranksville:ad-start'));
              var interstitial = window.admob.interstitial();
              interstitial.isReady().then(function (ready) {
                if (ready) {
                  interstitial.show().then(function () {
                    document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                    resolve();
                  }).catch(function () {
                    document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                    resolve();
                  });
                } else {
                  interstitial.load({ id: adUnitId }).then(function () {
                    return interstitial.show();
                  }).then(function () {
                    document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                    resolve();
                  }).catch(function () {
                    document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                    resolve();
                  });
                }
              }).catch(function () {
                document.dispatchEvent(new CustomEvent('pranksville:ad-end'));
                resolve();
              });
            });
          };
        } else {
          // Browser: React AdOverlay component handles the placeholder UI.
          // No window function is set, so AdOverlay shows its own countdown screen.
        }
      })();
    </script>
  </body>
</html>
